name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analytics.txt
      - run: pip install -r requirements-analytics.txt pytest
      # Build the warehouse so the reference-generator tests run too; no model needed.
      - run: dbt seed --profiles-dir . && dbt run --profiles-dir .
      - run: pytest -q
